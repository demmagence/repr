services:
  postgres:
    image: postgres:16-alpine
    container_name: repr_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: exercisedb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
